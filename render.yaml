services:
  - type: web
    name: ecoruta-temuco-nominatim
    runtime: node
    plan: free
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: node --check app/servidor/nominatim.mjs
    startCommand: node app/servidor/nominatim.mjs
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: ">=24.0.0 <25.0.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: ECORUTA_ORIGEN
        value: https://galbornoz-uct.github.io
