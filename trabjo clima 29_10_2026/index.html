
<!DOCTYPE html>

</head>
<body>

    <h1 id="tituloClima">El Clima en Temuco</h1>

    <!-- Seleccionar ciudad -->

    <br><br>

    <!-- Botón para cargar el clima -->

    <hr>

    <!-- Mostrar los datos -->
    <p id="parrafoTemperatura">
        Temperatura: Esperando datos...

    </p>

    <script src="script.js"></script>
